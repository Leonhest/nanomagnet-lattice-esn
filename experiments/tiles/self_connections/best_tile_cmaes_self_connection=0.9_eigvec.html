<script>
(function() {
    var data = JSON.parse(document.getElementById('eigvec-data').textContent);
    var plot = document.getElementById('eigvec-plot');
    var n = data.eigvals_re.length;

    // Click eigenvalue → show that eigenvector
    plot.on('plotly_click', function(eventData) {
        if (eventData.points[0].curveNumber !== 2) return;
        var idx = eventData.points[0].pointIndex;

        Plotly.restyle(plot, {z: [data.mag[idx]]}, [3]);
        Plotly.restyle(plot, {z: [data.phase[idx]], colorscale: [['RdBu']], zmin: [-Math.PI], zmax: [Math.PI]}, [4]);

        var widths = new Array(n).fill(0);
        var colors = new Array(n).fill('rgba(0,0,0,0)');
        widths[idx] = 2.5;
        colors[idx] = 'red';
        Plotly.restyle(plot, {'marker.line.width': [widths], 'marker.line.color': [colors]}, [2]);

        var re = data.eigvals_re[idx].toFixed(4);
        var im = data.eigvals_im[idx] >= 0
            ? '+' + data.eigvals_im[idx].toFixed(4)
            : data.eigvals_im[idx].toFixed(4);
        var abs_val = data.eigvals_abs[idx].toFixed(4);
        var label = 'λ' + idx + ' = ' + re + im + 'j  |λ| = ' + abs_val;

        var layout = plot.layout;
        var annotations = layout.annotations || [];
        if (annotations.length >= 4) {
            annotations[1].text = 'Magnitude |v| — ' + label;
            annotations[3].text = 'Phase ∠v — ' + label;
            Plotly.relayout(plot, {annotations: annotations});
        }

        document.getElementById('activity-btn').classList.remove('active');
    });

    // Total activity button
    document.getElementById('activity-btn').addEventListener('click', function() {
        this.classList.toggle('active');
        var isActive = this.classList.contains('active');

        if (isActive) {
            Plotly.restyle(plot, {z: [data.activity]}, [3]);
            // Phase coherence: 0 = incoherent mixing, 1 = all modes aligned
            Plotly.restyle(plot, {z: [data.coherence], colorscale: [['Viridis']], zmin: [0], zmax: [1]}, [4]);

            // Clear eigenvalue highlights
            var widths = new Array(n).fill(0);
            var colors = new Array(n).fill('rgba(0,0,0,0)');
            Plotly.restyle(plot, {'marker.line.width': [widths], 'marker.line.color': [colors]}, [2]);

            var annotations = plot.layout.annotations || [];
            if (annotations.length >= 4) {
                annotations[1].text = 'Total Activity — Σ |λᵢ|·|vᵢ|²';
                annotations[3].text = 'Phase Coherence (0=incoherent, 1=aligned)';
                Plotly.relayout(plot, {annotations: annotations});
            }
        } else {
            // Revert to dominant eigenvector
            Plotly.restyle(plot, {z: [data.mag[0]]}, [3]);
            Plotly.restyle(plot, {z: [data.phase[0]], colorscale: [['RdBu']], zmin: [-Math.PI], zmax: [Math.PI]}, [4]);

            var widths = new Array(n).fill(0);
            var colors = new Array(n).fill('rgba(0,0,0,0)');
            widths[0] = 2.5;
            colors[0] = 'red';
            Plotly.restyle(plot, {'marker.line.width': [widths], 'marker.line.color': [colors]}, [2]);

            var annotations = plot.layout.annotations || [];
            if (annotations.length >= 4) {
                var re = data.eigvals_re[0].toFixed(4);
                var im = data.eigvals_im[0] >= 0
                    ? '+' + data.eigvals_im[0].toFixed(4)
                    : data.eigvals_im[0].toFixed(4);
                annotations[1].text = 'Magnitude |v| — λ₀ = ' + re + im + 'j';
                annotations[3].text = 'Phase ∠v — λ₀ = ' + re + im + 'j';
                Plotly.relayout(plot, {annotations: annotations});
            }
        }
    });
})();
</script>
