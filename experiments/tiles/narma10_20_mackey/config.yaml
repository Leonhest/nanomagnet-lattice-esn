num_runs: 10
res_metrics: False
state_plot: False
plot_deciles: False
data:
  name: NARMA
  load: True
  system_order: 10
  sample_len: 6250
  split_ratio: 0.4
  val_ratio: 0.5
# data:
#     name: Mackey-Glass
#     load: false
#     sample_len: 6000
#     split_ratio: 0.4
#     val_ratio: 0.5
#     tau: 17
#     prediction_horizon: 1
esn:
  spectral_radius: 0.9
  f:
    name: tanh
    args:
      beta: 1
      shift: 0.15
  washout: 200
  readout:
    name: Ridge
    args:
      alpha: 0
  W_args:
    size: 400
    W_in_args:
      input_scale: 0.1
      distribution: fixed
    W_res_args:
      lattice: True
      self_connection: 0.1
      directed_edges_fraction: 0.9
      directed_edges_weights: 0.0
      sign_frac: 0.5
      weights_distribution: tile # constant, random, tile
      neighborhood: Moore
      tile:
        shape: [3, 3]
        method: random
optimization:
  method: cmaes
  num_evals: 3
  seed: 42
  cmaes:
    optimize_signs: false
    optimize_directions: false
    optimize_self_connections: false
    sigma0: 0.3
    max_generations: 10
    pop_size: 20
  hyperneat:
    cppn_config_file: ../../cppn_config.txt
    generations: 10
    threshold: 0.2
    substrate: grid
    substrate_shape: [3, 3]
  output:
    save_best_tile: true
